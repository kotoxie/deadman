[changelog]
header = ""
body = """
{% if version %}\
## 🚀 {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%B %d, %Y") }}
{% else %}\
## Unreleased
{% endif %}\

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {% if commit.breaking %}⚠️ **BREAKING:** {% endif %}{{ commit.message | upper_first }}\
{% if commit.github.username %} ([@{{ commit.github.username }}](https://github.com/{{ commit.github.username }})){% endif %}\
{% if commit.github.pr_number %} ([#{{ commit.github.pr_number }}](https://github.com/$GITHUB_REPO/pull/{{ commit.github.pr_number }})){% endif %}
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_preprocessors = [
  { pattern = '(#)(\d+)', replace = "[#${2}](https://github.com/$GITHUB_REPO/issues/${2})" }
]
commit_parsers = [
  { message = "^feat", group = "✨ New Features" },
  { message = "^fix", group = "🐛 Bug Fixes" },
  { message = "^perf", group = "⚡ Performance" },
  { message = "^refactor", group = "🔧 Refactoring" },
  { message = "^doc|^docs", group = "📚 Documentation" },
  { message = "^style", group = "🎨 Styling" },
  { message = "^test", group = "🧪 Tests" },
  { message = "^chore", group = "🔩 Chores", skip = true },
  { message = "^ci", group = "⚙️ CI/CD", skip = true },
  { body = ".*security", group = "🔒 Security" },
]
filter_commits = false
tag_pattern = "v[0-9]*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "newest"
