services:
  deadman:
    build: .
    container_name: deadman-switch
    restart: unless-stopped
    ports:
      - 6680:6680
    volumes:
      - ./deadman_data:/app/data
    environment:
      # TLS cert is auto-generated on first start and stored in DATA_DIR/tls/
      # To use a trusted cert instead, set TLS_CERT_PATH and TLS_KEY_PATH:
      # - TLS_CERT_PATH=/app/data/tls/cert.pem
      # - TLS_KEY_PATH=/app/data/tls/key.pem
